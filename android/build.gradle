group = "com.openwearables.health.sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// Capture THIS plugin's libs/maven path here, before the closure below evaluates
// per-subproject (where `project.projectDir` would resolve to the consuming app's
// dir, not ours).
def owSdkPluginLibsMaven = "${project.projectDir}/libs/maven"

rootProject.allprojects {
    repositories {
        // Local Maven repo bundled with this fork — contains the patched
        // Tamulus47/open_wearables_android_sdk@v0.11.1 (with @JvmName fix
        // for the setLogLevel platform-declaration clash) plus the Samsung
        // Health Data SDK. See README-PATCH.md for build details.
        maven {
            url = uri(owSdkPluginLibsMaven)
        }
        maven {
            url = uri("https://jitpack.io")
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.openwearables.health.sdk.flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 29
    }

    dependencies {
        // Patched fork of v0.11.1 — bundled in libs/maven (see README-PATCH.md).
        implementation("com.openwearables.health:sdk:0.11.1")

        // Testing
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
